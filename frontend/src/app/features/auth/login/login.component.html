<div
  class="min-h-screen bg-surface-canvas relative overflow-hidden flex flex-col md:items-center md:justify-center md:p-6 transition-colors duration-200"
>
  <!-- Botón de modo claro / oscuro -->
  <button
    type="button"
    (click)="themeService.toggle()"
    [attr.aria-label]="
      (themeService.theme() === 'dark' ? 'nav.theme.lightMode' : 'nav.theme.darkMode') | translate
    "
    [attr.title]="
      (themeService.theme() === 'dark' ? 'nav.theme.lightMode' : 'nav.theme.darkMode') | translate
    "
    class="fixed top-3 right-3 sm:top-5 sm:right-5 z-20 p-2 rounded-full bg-surface-card/90 backdrop-blur-md border border-border-subtle text-text-muted hover:text-text-main shadow-xs transition-colors cursor-pointer"
  >
    <kf-icon
      [name]="themeService.theme() === 'dark' ? 'icon-sun' : 'icon-moon'"
      class="w-4 h-4"
    />
  </button>

  <!-- Elementos decorativos de fondo (Desktop) -->
  <div
    class="hidden md:block pointer-events-none select-none text-neutral-0 dark:text-surface-elevated"
    aria-hidden="true"
  >
    <kf-icon
      name="bg-search"
      class="absolute top-[16%] left-[3%] w-52 h-52 lg:w-64 lg:h-64 -rotate-12 kf-float kf-float-1"
    />
    <span
      class="absolute bottom-[14%] left-[4%] font-serif italic text-6xl lg:text-7xl -rotate-12 kf-float kf-float-2"
    >
      flow
    </span>
    <kf-icon
      name="bg-folder"
      class="absolute top-[7%] right-[3%] w-56 h-56 lg:w-72 lg:h-72 kf-float kf-float-3"
    />
    <kf-icon
      name="bg-logo-k"
      class="absolute bottom-[5%] right-[5%] w-52 h-60 lg:w-64 lg:h-72 kf-float kf-float-4"
    />
  </div>

  <!-- Cabecera superior móvil -->
  <header
    class="md:hidden relative h-40 shrink-0 overflow-hidden bg-surface-canvas flex items-center justify-center"
  >
    <div
      class="pointer-events-none select-none text-neutral-0 dark:text-surface-elevated"
      aria-hidden="true"
    >
      <kf-icon name="bg-search" class="absolute -top-6 left-2 w-24 h-24 -rotate-12 kf-float kf-float-1" />
      <span class="absolute bottom-1 left-4 font-serif italic text-3xl -rotate-12 kf-float kf-float-2">flow</span>
      <kf-icon name="bg-folder" class="absolute -top-10 right-2 w-28 h-28 kf-float kf-float-3" />
      <kf-icon name="bg-logo-k" class="absolute -bottom-8 right-6 w-24 h-28 kf-float kf-float-4" />
    </div>

    <div class="relative z-10 flex justify-center">
      <kf-logo size="md" />
    </div>
  </header>

  <!-- Tarjeta principal -->
  <section
    class="relative z-10 w-full flex-1 md:flex-initial md:max-w-[440px] bg-surface-card md:rounded-2xl md:border md:border-neutral-200/70 md:dark:border-brand-300/40 md:shadow-sm px-6 pt-7 pb-10 md:px-10 md:pt-12 md:pb-24 transition-colors duration-200"
  >
    <!-- Logo escritorio -->
    <div class="hidden md:flex md:justify-center mb-8">
      <kf-logo size="md" />
    </div>

    <!-- Selector de pestaña (Iniciar Sesión / Registrarse) -->
    <div
      class="grid grid-cols-2 rounded-lg overflow-hidden border border-border-subtle bg-surface-subtle mb-7"
      role="tablist"
    >
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'login'"
        (click)="setTab('login')"
        class="py-2.5 px-3 text-xs sm:text-sm transition-colors cursor-pointer"
        [class]="
          activeTab() === 'login'
            ? 'bg-lilac-300 text-neutral-0 font-semibold'
            : 'text-text-muted hover:text-text-main font-medium'
        "
      >
        {{ 'auth.tabs.login' | translate }}
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'register'"
        (click)="setTab('register')"
        class="py-2.5 px-3 text-xs sm:text-sm transition-colors cursor-pointer border-l border-border-subtle"
        [class]="
          activeTab() === 'register'
            ? 'bg-lilac-300 text-neutral-0 font-semibold'
            : 'text-text-muted hover:text-text-main font-medium'
        "
      >
        {{ 'auth.tabs.register' | translate }}
      </button>
    </div>

    <!-- Formulario básico -->
    <form (submit)="onSubmit($event)" class="flex flex-col gap-3.5" novalidate>
      @if (activeTab() === 'login') {
        <label
          class="h-11 rounded-full border border-border-subtle bg-surface-card dark:bg-surface-deep px-4 flex items-center gap-3 transition-colors focus-within:border-brand-300 focus-within:ring-2 focus-within:ring-brand-300/20"
        >
          <kf-icon name="icon-mail" class="w-4 h-4 text-text-muted" />
          <input
            type="text"
            name="usernameOrEmail"
            autocomplete="username"
            [placeholder]="'auth.fields.usernameOrEmail' | translate"
            [attr.aria-label]="'auth.fields.usernameOrEmail' | translate"
            class="w-full bg-transparent text-sm text-text-main placeholder:text-text-muted/80 focus:outline-none"
          />
        </label>
      } @else {
        <label
          class="h-11 rounded-full border border-border-subtle bg-surface-card dark:bg-surface-deep px-4 flex items-center gap-3 transition-colors focus-within:border-brand-300 focus-within:ring-2 focus-within:ring-brand-300/20"
        >
          <kf-icon name="icon-user" class="w-4 h-4 text-text-muted" />
          <input
            type="text"
            name="username"
            autocomplete="username"
            [placeholder]="'auth.fields.username' | translate"
            [attr.aria-label]="'auth.fields.username' | translate"
            class="w-full bg-transparent text-sm text-text-main placeholder:text-text-muted/80 focus:outline-none"
          />
        </label>

        <label
          class="h-11 rounded-full border border-border-subtle bg-surface-card dark:bg-surface-deep px-4 flex items-center gap-3 transition-colors focus-within:border-brand-300 focus-within:ring-2 focus-within:ring-brand-300/20"
        >
          <kf-icon name="icon-mail" class="w-4 h-4 text-text-muted" />
          <input
            type="email"
            name="email"
            autocomplete="email"
            [placeholder]="'auth.fields.email' | translate"
            [attr.aria-label]="'auth.fields.email' | translate"
            class="w-full bg-transparent text-sm text-text-main placeholder:text-text-muted/80 focus:outline-none"
          />
        </label>
      }

      <label
        class="h-11 rounded-full border border-border-subtle bg-surface-card dark:bg-surface-deep px-4 flex items-center gap-3 transition-colors focus-within:border-brand-300 focus-within:ring-2 focus-within:ring-brand-300/20"
      >
        <kf-icon name="icon-lock" class="w-4 h-4 text-text-muted" />
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          [autocomplete]="activeTab() === 'login' ? 'current-password' : 'new-password'"
          [placeholder]="'auth.fields.passwordPlaceholder' | translate"
          [attr.aria-label]="'auth.fields.password' | translate"
          class="w-full bg-transparent text-sm text-text-main placeholder:text-text-muted/80 focus:outline-none"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="
            (showPassword() ? 'auth.actions.hidePassword' : 'auth.actions.showPassword')
              | translate
          "
          class="text-text-muted hover:text-text-main transition-colors cursor-pointer shrink-0"
        >
          <kf-icon
            [name]="showPassword() ? 'icon-eye-off' : 'icon-eye'"
            class="w-4 h-4"
          />
        </button>
      </label>

      <button
        type="submit"
        class="w-full h-11 mt-2 rounded-full bg-lilac-300 hover:bg-lilac-200 dark:hover:bg-brand-200 active:scale-[0.99] text-neutral-0 text-sm font-semibold transition-all cursor-pointer"
      >
        {{
          (activeTab() === 'login' ? 'auth.actions.loginSubmit' : 'auth.actions.registerSubmit')
            | translate
        }}
      </button>
    </form>

    <!-- Acción secundaria -->
    <div class="mt-4 text-center">
      @if (activeTab() === 'login') {
        <button
          type="button"
          class="text-xs font-medium text-brand-300 dark:text-brand-100 hover:underline cursor-pointer"
        >
          {{ 'auth.actions.forgotPassword' | translate }}
        </button>
      } @else {
        <button
          type="button"
          (click)="setTab('login')"
          class="text-xs font-medium text-brand-300 dark:text-brand-100 hover:underline cursor-pointer"
        >
          {{ 'auth.actions.alreadyHaveAccount' | translate }}
        </button>
      }
    </div>
  </section>
</div>
