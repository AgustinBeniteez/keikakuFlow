# Configuración de Servidor (8081 porque el puerto 8080 está ocupado por un servicio del sistema)
server.port=8081

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/keikakuflow_db
spring.datasource.username=agustin
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate (creación automática de todas las tablas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Configuración JWT (clave HS256 >= 32 bytes y expiración de 1 hora por defecto)
jwt.secret=${JWT_SECRET:KeikakuFlowSuperSecretKeyForHS256JwtSigning2026!!}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS para el frontend Angular
cors.allowed-origins=http://localhost:4200
